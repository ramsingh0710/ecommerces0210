
name: Deploy E-Commerce to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecommerce-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -eu

            REPO=/var/www/ecommerce
            APP=/var/www/ecommerce/E-Commerce-Management-System-main
            LIVE=/var/www/ecommerce/frontend-live

            cd "$REPO"
            git fetch origin main
            git reset --hard origin/main

            # Install backend dependencies
            cd "$APP/backend"
            npm ci

            # Keep the runtime database outside the Git repository
            sudo mkdir -p /var/lib/ecommerce
            sudo chown ubuntu:ubuntu /var/lib/ecommerce

            if [ ! -f /var/lib/ecommerce/db.json ]; then
              cp "$APP/backend/db.json" /var/lib/ecommerce/db.json
            fi

            # Restart the existing JSON Server process
            if pm2 describe ecommerce-backend >/dev/null 2>&1; then
              pm2 restart ecommerce-backend --update-env
            else
              pm2 start npx --name ecommerce-backend -- \
                json-server /var/lib/ecommerce/db.json \
                --host 127.0.0.1 --port 5000
            fi
            pm2 save

            # Build frontend
            cd "$APP/frontend"
            npm ci
            npm run build
            test -f dist/index.html

            # Publish the new frontend build
            mkdir -p "$LIVE"
            cp -a dist/. "$LIVE/"

            # Verify deployment
            curl -fsS http://127.0.0.1:5000/products \
              -o /dev/null
            curl -fsS http://127.0.0.1/ \
              -o /dev/null

            echo "Deployment completed successfully"
